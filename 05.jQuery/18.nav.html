<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네비게이션</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <style>
        li {
            list-style: none;
            width: 200px;
            height: 50px;
            float: left;
        }
        a {
            text-decoration: none;
            display: inline-block;
            color: white;
            background-color: blueviolet;
            width: 200px;
            height: 50px;
            text-align: center;
            line-height: 50px;
        }
    </style>
    <script>
        $(() => {
            $('li>a').hover(function() {
                let overColor = $(this).attr('data-bg');
                console.log(overColor);
                $(this).stop()
                       .animate({'background-color':overColor, 
                                 'color':'black'}, 
                                 1000);
            }, function() {
                $(this).animate({'background-color':'#8A2BE2', 'color':'white'}, 1000);
            })
        })
    </script>
</head>
<body>
    <ul>
        <li><a href="01.jQuery 개요.html" data-bg="#FFB2F5">Home</a></li>
        <li><a href="02.요소선택자(기본선택자).html" data-bg="#D1B2FF">About</a></li>
        <li><a href="03.요소선택자(추가적선택자).html" data-bg="#B5B2FF">Portfolio</a></li>
        <li><a href="04.요소선택(필터링관련선택자).html" data-bg="#B2CCFF">Contact</a></li>
    </ul>




    
</body>
</html>
